# docker compose up -d   ->   http://<homelab>:3000   (first visit asks you to create the administrator)
services:
  service-platform:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data          # database in ./data/db, daily backups in ./data/backups
    environment:
      BACKUP_KEEP: "14"
      # Sign-in cookies are https-only by default. Serving plain http (no reverse proxy)? Then uncomment:
      # COOKIE_SECURE: "false"
      # SESSION_SECRET: set to a long random value to keep sessions across rebuilds without the key file in ./data
